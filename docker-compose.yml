version: "3.9"

services:
  chatbot:
    build: .
    image: multi-agent-chatbot:latest
    container_name: ai_chatbot
    ports:
      - "8501:8501"
    volumes:
      # Persist the SQLite database and HuggingFace model cache
      - chatbot_data:/app/data
      - hf_cache:/root/.cache/huggingface
    environment:
      # Required
      - GROQ_API_KEY=${GROQ_API_KEY}
      # Optional
      - DB_PATH=/app/data/chatbot.db
      - ALPHAVANTAGE_API_KEY=${ALPHAVANTAGE_API_KEY:-}
      - MCP_SERVER_URL=${MCP_SERVER_URL:-http://127.0.0.1:8000/mcp}
      - MCP_ENABLED=${MCP_ENABLED:-true}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-Multi-Agent-AI-Chatbot}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  chatbot_data:
  hf_cache:
